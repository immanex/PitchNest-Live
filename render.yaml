services:
  - type: web
    name: pitchnest-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The frontend's Vercel address (or custom domain), no trailing
      # slash. CORS accepts only exact origins; "*" is not honoured.
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CORS_EXTRA_ORIGINS
        sync: false
      # Links in emails and payment redirects. Without CLIENT_URL, verification
      # emails point at localhost.
      - key: APP_BASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-10-21
      - key: OPENAI_API_KEY
        sync: false
      # Optional: Pro coaching model and reasoning effort (src/config/aiModels.ts).
      # Empty means Pro uses AZURE_OPENAI_DEPLOYMENT. Scoring never changes by plan.
      - key: AZURE_OPENAI_DEPLOYMENT_ADVANCED
        sync: false
      - key: AI_ADVANCED_REASONING_EFFORT
        sync: false
      # Reasoning for live panel replies, verdicts and tips when the model has
      # no effort of its own. Empty means "none" (fastest first word).
      - key: AI_LIVE_REASONING_EFFORT
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: STT_DEFAULT_LOCALE
        value: en-NG
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pitchnest-media
      - key: SUPABASE_AVATAR_BUCKET
        value: pitchnest-avatars
      - key: SUPABASE_PUBLIC_MEDIA_BUCKET
        value: pitchnest-avatars
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: PRO_PLAN_AMOUNT
        sync: false
      - key: PRO_PLAN_CURRENCY
        value: USD
      - key: PRO_PLAN_DAYS
        value: "30"
      - key: FIRST_SUBSCRIPTION_FREE_MONTHS
        value: "1"
      - key: FOUNDER_PLAN_AMOUNT
        sync: false
      - key: FOUNDER_ANNUAL_AMOUNT
        sync: false
      - key: PRO_ANNUAL_AMOUNT
        sync: false
      - key: PRO_ANNUAL_DAYS
        value: "365"
      - key: RESEARCH_ENABLED
        value: "false"
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TRIAL_JOBS_ENABLED
        value: "true"
      - key: PUBLIC_SITE_URL
        sync: false
      # Discover engagement stays dark until migration 0021 is applied and a
      # moderator account has users.is_staff = TRUE. Then set to "true".
      - key: FEATURE_DISCOVER_ENGAGEMENT
        value: "false"
      # Community discussions stay dark until migration 0023 is applied and
      # moderators are ready. Then set to "true".
      - key: FEATURE_COMMUNITY
        value: "false"
      # Pitch Arena (text pitches and structured feedback) stays dark until
      # migration 0026 is applied and FEATURE_DISCOVER_ENGAGEMENT is on, since
      # pitch feedback is posted as profile comments. Then set to "true".
      - key: FEATURE_PITCH_ARENA
        value: "false"
